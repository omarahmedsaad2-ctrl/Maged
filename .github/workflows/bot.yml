name: AI Bot Server

on:
  workflow_dispatch:
  schedule:
    # Auto-restart every 5 hours 50 minutes
    - cron: '50 */6 * * *'

concurrency:
  group: bot-server
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start bot server
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          # Start uvicorn in background
          python -m uvicorn api.index:app --host 0.0.0.0 --port 8000 &
          sleep 5

          # Start cloudflared tunnel and capture URL
          ./cloudflared tunnel --url http://localhost:8000 --logfile cloudflared.log &
          sleep 10

          # Extract the tunnel URL from logs
          TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
          echo "Tunnel URL: $TUNNEL_URL"

          # Set Telegram webhook automatically
          curl -s "$TUNNEL_URL/set-webhook"
          echo ""
          echo "Telegram webhook set!"

          # Set WhatsApp webhook automatically via Meta Graph API
          echo "Setting WhatsApp webhook..."
          WA_RESULT=$(curl -s -X POST "https://graph.facebook.com/v25.0/$META_APP_ID/subscriptions" \
            -d "object=whatsapp_business_account" \
            -d "callback_url=$TUNNEL_URL/whatsapp-webhook" \
            -d "verify_token=$WHATSAPP_VERIFY_TOKEN" \
            -d "fields=messages" \
            -d "access_token=${META_APP_ID}|${META_APP_SECRET}")
          echo "WhatsApp webhook result: $WA_RESULT"

          echo "========================================"
          echo "Both webhooks set automatically!"
          echo "Tunnel: $TUNNEL_URL"
          echo "========================================"

          # Keep alive for ~5 hours 50 minutes then auto-restart
          echo "Bot is running! Will auto-restart in ~5h50m..."
          sleep 21000

          echo "Time's up! The scheduled cron will restart the bot."
